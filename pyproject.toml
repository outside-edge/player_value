[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "player-value"
version = "0.1.0"
description = "Cricket player strength, contributions, and model comparisons"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Outside Edge" }]
keywords = ["cricket", "player-ratings", "sports-analytics", "wins-above-replacement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["PyYAML>=6.0.2", "numpy>=2.2", "scipy>=1.14", "scikit-learn>=1.8"]

[project.urls]
Homepage = "https://outside-edge.github.io/player_value/"
Repository = "https://github.com/outside-edge/player_value"
Issues = "https://github.com/outside-edge/player_value/issues"

[project.scripts]
player-value = "player_value.cli:main"

[dependency-groups]
dev = ["black>=26", "isort>=7", "flake8>=7", "pytest>=9", "build>=1.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/player_value"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux"
